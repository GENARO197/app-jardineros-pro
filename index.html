            <input type="number" id="edit-costo" placeholder="0" class="w-full border rounded-lg p-2 mt-1 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase">Ya Pagado ($)</label>
            <input type="number" id="edit-pagado" placeholder="0" class="w-full border rounded-lg p-2 mt-1 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>
      </div>
      <div class="flex gap-2 pt-3 border-t">
        <button onclick="cerrarModal()" class="flex-1 bg-gray-100 text-gray-700 py-2.5 rounded-xl font-bold text-sm hover:bg-gray-200">Cancelar</button>
        <button onclick="guardarCliente()" class="flex-1 bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-emerald-800">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    let clientes = JSON.parse(localStorage.getItem('jardineros_clientes')) || [
      { id: 1, nombre: 'Cornel Jones', notas: 'Calle Orquídeas 45 - Poda completa', dia: 'Lunes', tipo: 'Mes', costo: 270, pagado: 0 },
      { id: 2, nombre: 'María Gómez', notas: 'Av. Los Pinos 12 - Abono orgánico', dia: 'Lunes', tipo: 'Mes', costo: 150, pagado: 150 },
      { id: 3, nombre: 'Roberto Silva', notas: 'Corte rápido de césped', dia: 'Martes', tipo: 'Servicio', costo: 60, pagado: 60 }
    ];
    let diaFiltroActual = 'Todos';

    function guardarEnMemoria() {
      localStorage.setItem('jardineros_clientes', JSON.stringify(clientes));
      renderizarTodo();
    }

    function cambiarTab(tab) {
      ['dashboard', 'clientes', 'libreta', 'conta'].forEach(t => {
        document.getElementById('tab-' + t).classList.add('hidden');
        document.getElementById('nav-' + t).classList.remove('text-emerald-700', 'font-bold');
        document.getElementById('nav-' + t).classList.add('text-gray-400');
      });
      document.getElementById('tab-' + tab).classList.remove('hidden');
      document.getElementById('nav-' + tab).classList.add('text-emerald-700', 'font-bold');
      document.getElementById('nav-' + tab).classList.remove('text-gray-400');
    }

    function filtrarDia(dia) {
      diaFiltroActual = dia;
      document.querySelectorAll('.dia-btn').forEach(btn => {
        btn.className = btn.innerText === dia
          ? 'dia-btn bg-emerald-700 text-white px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap'
          : 'dia-btn bg-white text-gray-600 px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap border';
      });
      renderizarClientes();
    }
    function renderizarTodo() {
      let totalClientes = clientes.length;
      let totalCobrado = 0;
      let totalPorCobrar = 0;
      clientes.forEach(c => {
        totalCobrado += Number(c.pagado);
        let deuda = Number(c.costo) - Number(c.pagado);
        if (deuda > 0) totalPorCobrar += deuda;
      });
      document.getElementById('header-capacidad').innerText = `Capacidad: ${totalClientes} / 500 clientes`;
      document.getElementById('dash-total').innerText = totalClientes;
      document.getElementById('dash-cobrado').innerText = `$${totalCobrado}`;
      document.getElementById('dash-por-cobrar').innerText = `$${totalPorCobrar}`;
      document.getElementById('conta-ingresos').innerText = `$${totalCobrado.toFixed(2)}`;
      document.getElementById('conta-pendiente').innerText = `$${totalPorCobrar.toFixed(2)}`;
      document.getElementById('conta-barra-texto').innerText = `${totalClientes} / 500 clientes`;
      document.getElementById('conta-barra-progreso').style.width = `${(totalClientes / 500) * 100}%`;

      const listaDeudores = document.getElementById('lista-deudores');
      listaDeudores.innerHTML = '';
      const deudores = clientes.filter(c => (c.costo - c.pagado) > 0);
      if (deudores.length === 0) {
        listaDeudores.innerHTML = '<p class="text-xs text-emerald-600 font-semibold text-center py-2">🎉 ¡Todos tus clientes están al día!</p>';
      } else {
        deudores.forEach(c => {
          let debe = c.costo - c.pagado;
          listaDeudores.innerHTML += `<div onclick="abrirModalEditar(${c.id})" class="flex justify-between items-center p-2.5 bg-red-50/50 border border-red-100 rounded-lg cursor-pointer"><div><p class="font-bold text-sm text-gray-800">${c.nombre}</p><p class="text-[11px] text-gray-500">${c.dia} • ${c.tipo}</p></div><span class="bg-red-100 text-red-700 font-extrabold text-xs px-2.5 py-1 rounded-full">Debe $${debe}</span></div>`;
        });
      }
      renderizarClientes();
      renderizarLibreta();
    }

    function renderizarClientes() {
      const contenedor = document.getElementById('lista-clientes');
      contenedor.innerHTML = '';
      const filtrados = diaFiltroActual === 'Todos' ? clientes : clientes.filter(c => c.dia === diaFiltroActual);
      if (filtrados.length === 0) {
        contenedor.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-gray-400 text-sm">No tienes clientes programados para ${diaFiltroActual}.</div>`;
        return;
      }
      filtrados.forEach(c => {
        let debe = c.costo - c.pagado;
        let badgeEstado = debe <= 0
          ? `<span class="bg-emerald-100 text-emerald-700 text-[11px] font-bold px-2 py-0.5 rounded-full">Al día</span>`
          : `<span class="bg-red-100 text-red-700 text-[11px] font-bold px-2 py-0.5 rounded-full">Debe $${debe}</span>`;
        contenedor.innerHTML += `<div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3"><div onclick="abrirModalEditar(${c.id})" class="cursor-pointer space-y-1"><div class="flex justify-between items-start"><h3 class="font-bold text-base text-gray-800">${c.nombre}</h3>${badgeEstado}</div><p class="text-xs text-gray-500">${c.notas || 'Sin notas adicionales'}</p><div class="flex gap-3 text-xs font-semibold text-gray-600 pt-1"><span>📅 ${c.dia}</span><span>💳 ${c.tipo}: $${c.costo}</span></div></div><div class="flex gap-2 pt-2 border-t border-gray-100"><button onclick="pagarRapido(${c.id})" class="flex-1 bg-amber-500 text-white py-1.5 rounded-lg text-xs font-bold hover:bg-amber-600">$ Pagar</button><button onclick="abrirModalEditar(${c.id})" class="flex-1 bg-gray-100 text-gray-700 py-1.5 rounded-lg text-xs font-bold hover:bg-gray-200">📝 Editar</button><button onclick="borrarCliente(${c.id})" class="bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-rose-200">Borrar</button></div></div>`;
      });
    }

    function renderizarLibreta() {
      const tbody = document.getElementById('tabla-libreta');
      tbody.innerHTML = '';
      clientes.forEach(c => {
        let debe = c.costo - c.pagado;
        let estado = debe <= 0 ? `<span class="text-emerald-600 font-bold">Al día</span>` : `<span class="text-red-600 font-bold">Debe $${debe}</span>`;
        tbody.innerHTML += `<tr><td class="p-2.5 font-semibold text-gray-800">${c.nombre}</td><td class="p-2.5 text-gray-600">$${c.costo}</td><td class="p-2.5 text-gray-600">$${c.pagado}</td><td class="p-2.5">${estado}</td></tr>`;
      });
    }

    function abrirModalNuevo() {
      if (clientes.length >= 500) { alert("Límite de 500 clientes alcanzado."); return; }
      document.getElementById('modal-titulo').innerText = 'Nuevo Cliente';
      document.getElementById('edit-id').value = '';
      document.getElementById('edit-nombre').value = '';
      document.getElementById('edit-notas').value = '';
      document.getElementById('edit-dia').value = diaFiltroActual === 'Todos' ? 'Lunes' : diaFiltroActual;
      document.getElementById('edit-tipo').value = 'Mes';
      document.getElementById('edit-costo').value = '';
      document.getElementById('edit-pagado').value = '0';
      document.getElementById('modal-cliente').classList.replace('hidden', 'flex');
    }

    function abrirModalEditar(id) {
      const c = clientes.find(item => item.id === id);
      if (!c) return;
      document.getElementById('modal-titulo').innerText = 'Editar Cliente / Pago';
      document.getElementById('edit-id').value = c.id;
      document.getElementById('edit-nombre').value = c.nombre;
      document.getElementById('edit-notas').value = c.notas;
      document.getElementById('edit-dia').value = c.dia;
      document.getElementById('edit-tipo').value = c.tipo;
      document.getElementById('edit-costo').value = c.costo;
      document.getElementById('edit-pagado').value = c.pagado;
      document.getElementById('modal-cliente').classList.replace('hidden', 'flex');
    }

    function cerrarModal() {
      document.getElementById('modal-cliente').classList.replace('flex', 'hidden');
    }

    function guardarCliente() {
      const id = document.getElementById('edit-id').value;
      const nombre = document.getElementById('edit-nombre').value.trim();
      const notas = document.getElementById('edit-notas').value.trim();
      const dia = document.getElementById('edit-dia').value;
      const tipo = document.getElementById('edit-tipo').value;
      const costo = Number(document.getElementById('edit-costo').value) || 0;
      const pagado = Number(document.getElementById('edit-pagado').value) || 0;
      if (!nombre) { alert('Escribe el nombre del cliente.'); return; }
      if (id) {
        const index = clientes.findIndex(c => c.id == id);
        if (index !== -1) clientes[index] = { id: Number(id), nombre, notas, dia, tipo, costo, pagado };
      } else {
        clientes.push({ id: Date.now(), nombre, notas, dia, tipo, costo, pagado });
      }
      cerrarModal();
      guardarEnMemoria();
    }

    function pagarRapido(id) {
      const index = clientes.findIndex(c => c.id === id);
      if (index !== -1) { clientes[index].pagado = clientes[index].costo; guardarEnMemoria(); }
    }

    function borrarCliente(id) {
      if (confirm('¿Borrar este cliente?')) { clientes = clientes.filter(c => c.id !== id); guardarEnMemoria(); }
    }

    function reiniciarMes() {
      if (confirm('¿Iniciar nuevo mes? Se reiniciarán los pagos mensuales a $0.')) {
        clientes = clientes.map(c => { if (c.tipo === 'Mes') c.pagado = 0; return c; });
        guardarEnMemoria();
      }
    }

    renderizarTodo();
  </script>
</body>
</html>
