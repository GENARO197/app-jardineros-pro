<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1F6B45" />
<title>Verde Pro — Panel del jardinero</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --green:#1F6B45; --green-dark:#154D32; --green-soft:#E8F3EC; --green-mid:#CFE6D7;
    --ink:#14281D; --muted:#5E7266; --line:#E3ECE6; --bg:#F6FAF7; --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#DDE9E1;font-family:"Geist",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 12px}
  .phone{position:relative;width:100%;max-width:390px;height:800px;background:var(--bg);border-radius:36px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(20,40,29,.35),0 0 0 8px #14281D}
  @media (max-width:440px){body{padding:0}.phone{max-width:none;height:100vh;border-radius:0;box-shadow:none}}
  .scroll{height:100%;overflow-y:auto;padding-bottom:150px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  svg{width:20px;height:20px;stroke-width:2}

  header{background:var(--green);color:var(--white);padding:22px 20px 64px;border-radius:0 0 28px 28px}
  .status{display:flex;justify-content:space-between;font-size:12px;font-weight:600;opacity:.85;margin-bottom:18px}
  .top{display:flex;align-items:center;gap:12px}
  .avatar{width:48px;height:48px;border-radius:50%;background:var(--green-mid);color:var(--green-dark);display:grid;place-items:center;font-weight:700;font-size:17px;flex-shrink:0}
  .hello small{display:block;font-size:13px;opacity:.8}
  .hello h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
  .icon-btn{margin-left:auto;width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:var(--white);display:grid;place-items:center;position:relative;cursor:pointer}
  .icon-btn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:#B8F0CB;border:2px solid var(--green)}

  .sub{margin:-46px 16px 0;background:var(--white);border-radius:20px;padding:16px;box-shadow:0 10px 30px -12px rgba(20,40,29,.25);position:relative}
  .sub-row{display:flex;align-items:center;gap:10px}
  .sub-ic{width:40px;height:40px;border-radius:12px;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
  .sub-row h2{font-size:15px;font-weight:700}
  .sub-row p{font-size:12.5px;color:var(--muted)}
  .badge{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--green);background:var(--green-soft);padding:5px 10px;border-radius:999px;display:flex;align-items:center;gap:5px}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
  .bar{height:6px;background:var(--green-soft);border-radius:99px;margin:14px 0 6px;overflow:hidden}
  .bar span{display:block;height:100%;width:72%;background:var(--green);border-radius:99px}
  .bar-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:12px}
  .stat b{display:block;font-size:20px;font-weight:700;color:var(--green-dark)}
  .stat span{font-size:11.5px;color:var(--muted)}

  .sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 20px 12px}
  .sec-head h3{font-size:17px;font-weight:700}
  .sec-head a{font-size:13px;color:var(--green);font-weight:600;text-decoration:none}

  .days{display:flex;gap:8px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 52px;border:1px solid var(--line);background:var(--white);border-radius:16px;padding:10px 0;text-align:center;cursor:pointer;color:var(--ink);font:inherit}
  .day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
  .day b{font-size:17px}
  .day i{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:transparent}
  .day.has i{background:var(--green)}
  .day[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--white)}
  .day[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
  .day[aria-pressed="true"] i{background:var(--white)}

  .visits{list-style:none;padding:14px 16px 0;display:flex;flex-direction:column;gap:12px}
  .visit{display:flex;gap:12px}
  .time{width:46px;flex-shrink:0;text-align:right;padding-top:14px}
  .time b{display:block;font-size:14px}
  .time span{font-size:11px;color:var(--muted)}
  .card{flex:1;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px;border-left:4px solid var(--green);transition:opacity .2s}
  .card.done{opacity:.55;border-left-color:var(--green-mid)}
  .card.done h4{text-decoration:line-through}
  .card-top{display:flex;align-items:flex-start;gap:8px}
  .card h4{font-size:15px;font-weight:700}
  .check{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--green-mid);background:var(--white);color:var(--green);display:grid;place-items:center;cursor:pointer;flex-shrink:0}
  .check svg{width:16px;height:16px;opacity:0}
  .card.done .check{background:var(--green);border-color:var(--green);color:var(--white)}
  .card.done .check svg{opacity:1}
  .meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:6px}
  .meta svg{width:15px;height:15px;flex-shrink:0}
  .tag{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:600;color:var(--green-dark);background:var(--green-soft);padding:6px 10px;border-radius:10px}
  .tag svg{width:14px;height:14px}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 20px;background:var(--white);border:1px dashed var(--green-mid);border-radius:18px;margin:14px 16px 0}

  .fab{position:absolute;right:16px;bottom:96px;height:60px;padding:0 22px 0 18px;border:0;border-radius:20px;background:var(--green);color:var(--white);font:inherit;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 14px 30px -8px rgba(31,107,69,.6);cursor:pointer;z-index:5}
  .fab:active{transform:scale(.97)}
  .fab svg{width:22px;height:22px;stroke-width:2.5}

  nav{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--white);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px;z-index:4}
  nav button{border:0;background:none;font:inherit;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:70px}
  nav button[aria-current="page"]{color:var(--green)}

  .overlay{position:absolute;inset:0;background:rgba(20,40,29,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--white);border-radius:28px 28px 0 0;padding:12px 20px 28px;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:11}
  .open .overlay{opacity:1;pointer-events:auto}
  .open .sheet{transform:none}
  .grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 16px}
  .sheet h3{font-size:19px;font-weight:700;margin-bottom:4px}
  .sheet > p{font-size:13px;color:var(--muted);margin-bottom:16px}
  label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 6px}
  input,select{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);outline:none}
  input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .submit{width:100%;height:54px;margin-top:20px;border:0;border-radius:16px;background:var(--green);color:var(--white);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  .toast{position:absolute;left:50%;top:20px;transform:translate(-50%,-80px);background:var(--ink);color:var(--white);padding:12px 16px;border-radius:14px;font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center;transition:transform .3s;z-index:20;white-space:nowrap}
  .toast.show{transform:translate(-50%,0)}
  .toast svg{color:#B8F0CB;width:18px;height:18px}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="scroll">
    <header>
      <div class="status" aria-hidden="true"><span>9:41</span><span>Lunes, 10 nov</span></div>
      <div class="top">
        <div class="avatar" aria-hidden="true">CR</div>
        <div class="hello">
          <small>Buenos días,</small>
          <h1>Carlos Ramírez</h1>
        </div>
        <button class="icon-btn" aria-label="Notificaciones (1 nueva)"><i data-lucide="bell"></i><span class="dot"></span></button>
      </div>
    </header>

    <section class="sub" aria-label="Estado de suscripción">
      <div class="sub-row">
        <div class="sub-ic"><i data-lucide="sprout"></i></div>
        <div>
          <h2>Plan Profesional</h2>
          <p>Renueva el 15 dic 2026</p>
        </div>
        <span class="badge">Activa</span>
      </div>
      <div class="bar" role="progressbar" aria-valuenow="36" aria-valuemax="50" aria-label="Clientes usados"><span></span></div>
      <div class="bar-meta"><span>36 de 50 clientes</span><span>14 disponibles</span></div>
    </section>

    <section class="stats" aria-label="Resumen de hoy">
      <div class="stat"><b id="statVisits">4</b><span>Visitas hoy</span></div>
      <div class="stat"><b id="statDone">0</b><span>Completadas</span></div>
      <div class="stat"><b>$2.4k</b><span>Este mes</span></div>
    </section>

    <div class="sec-head">
      <h3>Próximas visitas</h3>
      <a href="#" onclick="return false">Ver calendario</a>
    </div>
    <div class="days" id="days" role="group" aria-label="Seleccionar día"></div>
    <ul class="visits" id="visits"></ul>
  </div>

  <button class="fab" id="fab"><i data-lucide="user-plus"></i>Agregar Cliente</button>

  <nav aria-label="Navegación principal">
    <button aria-current="page"><i data-lucide="house"></i>Inicio</button>
    <button><i data-lucide="calendar-days"></i>Agenda</button>
    <button><i data-lucide="users"></i>Clientes</button>
    <button><i data-lucide="user-round"></i>Perfil</button>
  </nav>

  <div class="overlay" id="overlay"></div>
  <form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grip"></div>
    <h3 id="sheetTitle">Nuevo cliente</h3>
    <p>Agrega un cliente y programa su primera visita.</p>
    <label for="fName">Nombre completo</label>
    <input id="fName" required placeholder="Ej. Ana Torres" autocomplete="name" />
    <label for="fAddr">Dirección</label>
    <input id="fAddr" required placeholder="Ej. Av. Jacarandas #12" autocomplete="street-address" />
    <label for="fService">Servicio</label>
    <select id="fService">
      <option>Corte de césped</option>
      <option>Poda de rosales</option>
      <option>Poda de árboles</option>
      <option>Riego y fertilización</option>
      <option>Diseño de jardín</option>
    </select>
    <div class="row">
      <div><label for="fDay">Día</label><select id="fDay"></select></div>
      <div><label for="fTime">Hora</label><input id="fTime" type="time" value="15:00" required /></div>
    </div>
    <button class="submit" type="submit">Guardar cliente</button>
  </form>

  <div class="toast" id="toast" role="status"><i data-lucide="circle-check"></i><span id="toastText"></span></div>
</div>

<script>
  const dayNames = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const days = Array.from({length:7},(_,i)=>{const d=new Date(2026,10,10+i);return {key:i,label:dayNames[d.getDay()],num:d.getDate()}});
  const icons = {"Poda de rosales":"flower-2","Corte de césped":"scissors","Poda de árboles":"trees","Riego y fertilización":"droplets","Diseño de jardín":"shovel"};
  const visits = {
    0:[
      {time:"08:30",name:"María Gómez",addr:"Calle Orquídeas #45",service:"Poda de rosales",done:false},
      {time:"10:30",name:"Jorge Herrera",addr:"Av. Los Pinos #120",service:"Corte de césped",done:false},
      {time:"13:00",name:"Lucía Fernández",addr:"Privada Girasoles #8",service:"Riego y fertilización",done:false},
      {time:"16:00",name:"Roberto Salas",addr:"Calle Magnolia #301",service:"Poda de árboles",done:false}
    ],
    1:[{time:"09:00",name:"Elena Ruiz",addr:"Calle Tulipanes #19",service:"Diseño de jardín",done:false}],
    2:[{time:"08:00",name:"Familia Ortiz",addr:"Blvd. Ceibas #77",service:"Corte de césped",done:false},{time:"11:30",name:"Pedro Luna",addr:"Calle Lirios #5",service:"Poda de rosales",done:false}],
    4:[{time:"10:00",name:"Sofía Medina",addr:"Av. Bugambilias #210",service:"Riego y fertilización",done:false}]
  };
  let selected = 0;

  const $ = id => document.getElementById(id);
  const fmt = t => {const [h,m]=t.split(":").map(Number);return {t:`${((h+11)%12)+1}:${String(m).padStart(2,"0")}`,ap:h<12?"a.m.":"p.m."}};

  function renderDays(){
    $("days").innerHTML = days.map(d=>`<button class="day ${visits[d.key]?.length?"has":""}" aria-pressed="${d.key===selected}" data-k="${d.key}" aria-label="${d.label} ${d.num}"><small>${d.label}</small><b>${d.num}</b><i></i></button>`).join("");
    $("fDay").innerHTML = days.map(d=>`<option value="${d.key}" ${d.key===selected?"selected":""}>${d.label} ${d.num}</option>`).join("");
  }
  function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function renderVisits(){
    const list = (visits[selected]||[]).sort((a,b)=>a.time.localeCompare(b.time));
    const ul = $("visits");
    if(!list.length){
      ul.innerHTML = `<li class="empty">Sin visitas programadas este día.<br/>Toca “Agregar Cliente” para programar una.</li>`;
    } else {
      ul.innerHTML = list.map((v,i)=>{const f=fmt(v.time);return `
        <li class="visit">
          <div class="time"><b>${f.t}</b><span>${f.ap}</span></div>
          <article class="card ${v.done?"done":""}">
            <div class="card-top">
              <h4>${esc(v.name)}</h4>
              <button class="check" data-i="${i}" aria-label="Marcar visita de ${esc(v.name)} como ${v.done?"pendiente":"completada"}"><i data-lucide="check"></i></button>
            </div>
            <div class="meta"><i data-lucide="map-pin"></i>${esc(v.addr)}</div>
            <span class="tag"><i data-lucide="${icons[v.service]||"leaf"}"></i>${esc(v.service)}</span>
          </article>
        </li>`}).join("");
    }
    if(selected===0){$("statVisits").textContent=list.length;$("statDone").textContent=list.filter(v=>v.done).length}
    lucide.createIcons();
  }

  $("days").addEventListener("click",e=>{const b=e.target.closest(".day");if(!b)return;selected=+b.dataset.k;renderDays();renderVisits()});
  $("visits").addEventListener("click",e=>{const b=e.target.closest(".check");if(!b)return;const v=visits[selected][+b.dataset.i];v.done=!v.done;renderVisits();if(v.done)toast(`Visita a ${v.name} completada`)});

  const phone=$("phone");
  const openSheet=()=>{phone.classList.add("open");$("fDay").value=selected;setTimeout(()=>$("fName").focus(),300)};
  const closeSheet=()=>{phone.classList.remove("open");$("fab").focus()};
  $("fab").addEventListener("click",openSheet);
  $("overlay").addEventListener("click",closeSheet);
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&phone.classList.contains("open"))closeSheet()});
  $("sheet").addEventListener("submit",e=>{
    e.preventDefault();
    const k=+$("fDay").value;
    (visits[k] ||= []).push({time:$("fTime").value,name:$("fName").value.trim(),addr:$("fAddr").value.trim(),service:$("fService").value,done:false});
    toast(`${$("fName").value.trim()} agregado`);
    e.target.reset();$("fTime").value="15:00";
    selected=k;closeSheet();renderDays();renderVisits();
  });

  let tt;
  function toast(msg){$("toastText").textContent=msg;$("toast").classList.add("show");clearTimeout(tt);tt=setTimeout(()=>$("toast").classList.remove("show"),2200)}

  renderDays();renderVisits();
</script>
</body>
</html>
